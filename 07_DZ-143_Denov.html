<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DZ-143 — Avtogreyder · Автогрейдер · Motor grader</title>
<style>
:root{--n9:#070d18;--n8:#0b1526;--n7:#101f38;--n6:#16294a;--line:rgba(212,175,110,.34);--line-s:rgba(212,175,110,.16);
--g:#d8b26c;--gh:#f2dda8;--gd:#b98f45;--gp:#f0d9a8;--sand:#e9dcc4;--tx:#dfd4bf;--dim:rgba(223,212,191,.68);
--disp:"Cormorant Garamond","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;--body:"Manrope","Segoe UI",Helvetica,Arial,sans-serif;
--sh:0 1.2rem 3rem rgba(0,0,0,.55);--e:cubic-bezier(.22,.9,.28,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(0.55vw + 0.55vh)}
body{font-family:var(--body);background:var(--n9);color:var(--tx);height:100vh;width:100vw;overflow:hidden;user-select:none;-webkit-user-select:none}
img{display:block}button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s;z-index:1}
.scr.on{opacity:1;visibility:visible;z-index:5}
/* bg */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(130% 95% at 50% 0%,#14263f 0%,#0a1120 58%,#070d18 100%)}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;transform:scale(1.04);transition:opacity 1s,filter 1s}
.bg.contain img{object-fit:contain;padding:22vh 6vw 20vh;opacity:.75;transform:none;filter:drop-shadow(0 4vh 8vh rgba(0,0,0,.7))}
.bg svg{position:absolute;left:50%;top:50%;width:60vw;transform:translate(-50%,-50%);opacity:.85}
.bg .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,13,24,.55) 0%,rgba(7,13,24,.10) 34%,rgba(7,13,24,.40) 66%,rgba(7,13,24,.90) 100%)}
.bg .grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.25) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 1px,transparent 1px 3px)}
body.inner .bg img{opacity:.35;filter:blur(1.5px) saturate(.85)}
body.inner .bg svg{opacity:.18}
body.inner .bg .veil{background:linear-gradient(180deg,rgba(5,10,20,.5) 0%,rgba(6,12,22,.72) 40%,rgba(5,10,20,.94) 100%)}
/* splash */
#splash{padding:2rem 3rem 3rem;align-items:center;text-align:center}
.top{display:flex;align-items:center;gap:2rem;width:100%;padding:1.4rem 2.8rem;background:linear-gradient(135deg,rgba(16,31,56,.78),rgba(11,22,40,.62) 50%,rgba(7,14,26,.85));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(212,175,110,.35);border-radius:1.6rem;box-shadow:0 1rem 3rem rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.12);animation:fdown .9s .1s both;flex-shrink:0}
.logo{width:7.5rem;height:auto;flex:0 0 auto;filter:drop-shadow(0 .6rem 1.6rem rgba(0,0,0,.75))}
.org{text-align:left;font-size:1.45rem;line-height:1.4;letter-spacing:.12em;color:var(--sand);text-transform:uppercase;font-weight:500}
.org b{display:block;font-family:var(--disp);font-weight:700;color:var(--gh);font-size:1.3em;line-height:1.3;letter-spacing:.18em;margin-top:.4rem;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.mid{padding:6rem 12rem;border-radius:50%;background:radial-gradient(ellipse at center,rgba(7,13,24,.88) 0%,rgba(7,13,24,.55) 45%,transparent 72%);display:flex;flex-direction:column;align-items:center;gap:.6rem;flex:1;justify-content:center;animation:fup 1s .5s both}
.hero{font-family:var(--disp);font-weight:700;font-size:7.6rem;line-height:1.02;letter-spacing:.07em;background:linear-gradient(180deg,#fbfbfb 0%,#fff5e3 45%,#ffc257 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .4rem 1.2rem rgba(0,0,0,.8))}
.hero-sup{font-family:var(--disp);font-weight:600;font-size:2.2rem;letter-spacing:.42em;color:var(--sand);text-transform:uppercase;padding-left:.42em;text-shadow:0 .15rem .3rem rgba(0,0,0,.45)}
.hero-sub{font-family:var(--disp);font-weight:600;font-size:2.6rem;letter-spacing:.34em;color:var(--gh);text-transform:uppercase;margin-top:.6rem;padding-left:.34em;text-shadow:0 .15rem .3rem rgba(0,0,0,.45)}
.hero-sub small{display:block;font-size:.62em;letter-spacing:.3em;color:var(--sand);opacity:.85;margin-top:.5rem}
.bot{display:flex;flex-direction:column;align-items:center;gap:1.4rem;width:100%;margin-top:auto;padding-top:.8rem}
.choose{font-size:1.24rem;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);animation:fup 1s .7s both}
.langs{display:flex;gap:2.4rem;justify-content:center;width:100%}
.lang{position:relative;width:16.5rem;height:12.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding-top:2.4rem;background:linear-gradient(180deg,rgba(16,31,56,.62),rgba(8,15,28,.82));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:8.2rem 8.2rem 1.2rem 1.2rem;box-shadow:var(--sh),inset 0 0 4rem rgba(216,178,108,.06);transition:transform .28s cubic-bezier(.2,.9,.3,1.2),box-shadow .28s,border-color .28s;animation:fup .9s both}
.lang:nth-child(1){animation-delay:.85s}.lang:nth-child(2){animation-delay:.97s}.lang:nth-child(3){animation-delay:1.09s}
.lang:active{transform:scale(.965)}.lang:hover{border-color:rgba(212,175,110,.85);box-shadow:0 1.4rem 3.6rem rgba(0,0,0,.6),0 0 3rem rgba(216,178,108,.22),inset 0 0 4rem rgba(216,178,108,.12)}
.lang b{font-family:var(--disp);font-weight:700;font-size:3.3rem;letter-spacing:.14em;color:var(--gh)}
.lang i{width:5rem;height:1px;background:var(--line);margin:.6rem 0 .2rem}
.lang span{font-size:1.24rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);font-style:normal}
/* inner head */
.head{display:flex;align-items:center;gap:2.2rem;padding:1.6rem 3.4rem;border-bottom:1px solid rgba(212,175,110,.35);background:linear-gradient(135deg,rgba(16,31,56,.85),rgba(11,22,40,.7) 50%,rgba(7,14,26,.92));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1rem 3rem rgba(0,0,0,.5);flex:0 0 auto;z-index:50;position:relative}
.head .logo{width:5.4rem}
.head .txt{flex:1;min-width:0;text-align:left}
.head .o{font-family:var(--disp);font-size:1.02rem;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);line-height:1.7}
.head .nm{font-family:var(--disp);font-size:1.9rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gh);margin-top:.3rem;font-weight:700}
/* deck */
#deck{position:relative;flex:1;min-height:0;perspective:1600px}
.sl{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s var(--e),visibility .9s,transform 1.1s var(--e);transform:scale(1.015)}
.sl.on{opacity:1;visibility:visible;transform:none;z-index:2}
.vis{position:absolute;inset:0;overflow:hidden}
.vis img{width:100%;height:100%;display:block;transform-origin:50% 45%}
.vis.cover img{object-fit:cover;object-position:50% 45%}
.vis.contain img{object-fit:contain;padding:5vh 6vw 30vh}
.vis.contain{background:radial-gradient(120% 100% at 50% 18%,#16283f,#080e18)}
@keyframes kbin{from{transform:scale(1.005)}to{transform:scale(1.10) translate3d(-1.2%,-1%,0)}}
.sl.on .vis.cover img{animation:kbin 15s linear both}
@keyframes soft{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.sl.on .vis.contain img{animation:soft 1.5s var(--e) both}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(7,13,24,.55) 0%,rgba(7,13,24,.10) 22%,rgba(7,13,24,.55) 56%,rgba(7,13,24,.96) 100%)}
@keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes upS{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes track{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.42em}}
@keyframes left{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes fup{from{opacity:0;transform:translateY(3.2rem)}to{opacity:1;transform:none}}
@keyframes fdown{from{opacity:0;transform:translateY(-2.4rem)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.cap{position:absolute;left:0;right:0;bottom:0;padding:0 7vw 11vh;z-index:3}
.cap .k{font-size:clamp(11px,.95vw,17px);letter-spacing:.36em;text-transform:uppercase;color:var(--g);margin-bottom:12px}
.cap h2{font-family:var(--disp);font-size:clamp(32px,3.7vw,62px);line-height:1.08;margin:0 0 14px;color:var(--gp)}
.cap p{max-width:52em;font-size:clamp(16px,1.3vw,25px);line-height:1.6;color:#eae4d6}
.sl.on .cap .k{animation:track 1.2s var(--e) .1s both}.sl.on .cap h2{animation:up 1s var(--e) .18s both}.sl.on .cap p{animation:up 1s var(--e) .40s both}
/* title */
.ti{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 10vw 6vh}
.ti .kick{font-size:clamp(12px,1.05vw,19px);letter-spacing:.42em;text-transform:uppercase;color:var(--g);margin-bottom:24px}
.ti h1{font-family:var(--disp);font-size:clamp(60px,7.5vw,140px);line-height:1;margin:0 0 6px;color:var(--gp);font-weight:700}
.ti .sub{font-family:var(--disp);font-size:clamp(22px,2.4vw,44px);letter-spacing:.2em;text-transform:uppercase;color:var(--sand)}
.ti .rule{width:min(320px,40vw);height:1px;background:linear-gradient(90deg,transparent,var(--g),transparent);margin:22px 0 24px}
.ti p{max-width:42em;font-size:clamp(16px,1.4vw,26px);line-height:1.6;color:#dcd6c8}
.arch{width:min(150px,12vw);opacity:.32;margin-bottom:2vh}.arch path{fill:none;stroke:var(--g);stroke-width:3.4;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400}
.sl.on .arch path{animation:draw 2.6s var(--e) .2s both}@keyframes draw{to{stroke-dashoffset:0}}
.sl.on .ti .kick{animation:track 1.5s var(--e) .5s both}.sl.on .ti h1{animation:up 1.2s var(--e) .8s both}.sl.on .ti .sub{animation:up 1.2s var(--e) 1s both}.sl.on .ti .rule{animation:grow 1.2s var(--e) 1.4s both}.sl.on .ti p{animation:up 1.1s var(--e) 1.6s both}
/* passport */
.pas{position:absolute;inset:0;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:4vw;padding:0 8vw 6vh}
.pas h2{font-family:var(--disp);font-size:clamp(32px,3.7vw,62px);color:var(--gp);margin-bottom:3vh;grid-column:1/-1;align-self:end}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:2.4vh 2vw}
.facts div{border-left:1px solid var(--line);padding-left:1.4vw}
.facts small{display:block;font-size:clamp(11px,.9vw,16px);letter-spacing:.3em;text-transform:uppercase;color:var(--g);margin-bottom:.8vh}
.facts b{font-family:var(--disp);font-size:clamp(22px,2vw,38px);color:#f5eedf;font-weight:600;line-height:1.2}
.sl.on .facts div{animation:left .85s var(--e) both}
.sl.on .facts div:nth-child(1){animation-delay:.4s}.sl.on .facts div:nth-child(2){animation-delay:.55s}.sl.on .facts div:nth-child(3){animation-delay:.7s}.sl.on .facts div:nth-child(4){animation-delay:.85s}.sl.on .facts div:nth-child(5){animation-delay:1s}
.age{text-align:center}
.age b{display:block;font-family:var(--disp);font-weight:700;font-size:clamp(120px,15vw,260px);line-height:.86;color:var(--gp);text-shadow:0 1.2vh 5vh rgba(0,0,0,.75)}
.age span{display:block;margin-top:1.4vh;letter-spacing:.42em;text-transform:uppercase;color:var(--g);font-size:clamp(12px,1.1vw,20px)}
.age i{display:block;width:14vw;height:1px;margin:2.6vh auto 0;background:linear-gradient(90deg,transparent,var(--g),transparent)}
.sl.on .age b{animation:numin 1.5s var(--e) .2s both}.sl.on .age span{animation:track 1.4s var(--e) .7s both}.sl.on .age i{animation:grow 1.2s var(--e) 1s both}
@keyframes numin{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
/* text / list */
.lst{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 8vw 6vh}
.lst .k{font-size:clamp(11px,.95vw,17px);letter-spacing:.36em;text-transform:uppercase;color:var(--g);margin-bottom:1.6vh}
.lst h2{font-family:var(--disp);font-size:clamp(32px,3.7vw,62px);margin:0 0 8px;color:var(--gp)}
.lst .lead{font-family:var(--disp);font-size:clamp(22px,2vw,38px);line-height:1.35;color:#f5eedf;max-width:40em;margin-bottom:3vh}
.lst .sub{font-size:clamp(15px,1.25vw,23px);color:#cfc7b6;max-width:50em;line-height:1.6;margin:0 0 3vh}
.lst ol{list-style:none;display:grid;gap:2vh;counter-reset:n}
.lst ol.two{grid-template-columns:1fr 1fr;gap:2vh 4vw}
.lst li{counter-increment:n;position:relative;padding-left:clamp(52px,4.6vw,84px);font-size:clamp(17px,1.45vw,29px);line-height:1.45;color:#f0ead9}
.lst li::before{content:counter(n,decimal-leading-zero);position:absolute;left:0;top:.05em;font-family:var(--disp);font-size:clamp(19px,1.7vw,34px);color:var(--g);letter-spacing:.06em}
.sl.on .lst .k{animation:track 1.2s var(--e) .1s both}.sl.on .lst h2{animation:up 1s var(--e) .15s both}.sl.on .lst .lead,.sl.on .lst .sub{animation:up 1s var(--e) .35s both}
.sl.on .lst li{animation:left .85s var(--e) both}
.sl.on .lst li:nth-child(1){animation-delay:.6s}.sl.on .lst li:nth-child(2){animation-delay:.75s}.sl.on .lst li:nth-child(3){animation-delay:.9s}.sl.on .lst li:nth-child(4){animation-delay:1.05s}.sl.on .lst li:nth-child(5){animation-delay:1.2s}.sl.on .lst li:nth-child(6){animation-delay:1.35s}.sl.on .lst li:nth-child(7){animation-delay:1.5s}
/* specs */
.spc{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center;padding:0 8vw 6vh}
.spc h2{grid-column:1/-1;font-family:var(--disp);font-size:clamp(32px,3.7vw,62px);color:var(--gp);align-self:end}
.spc h3{font-family:var(--disp);font-size:clamp(18px,1.6vw,30px);letter-spacing:.12em;text-transform:uppercase;color:var(--sand);margin-bottom:2vh}
.spc ul{list-style:none}
.spc li{position:relative;padding:1.2vh 0 1.2vh 30px;font-size:clamp(15px,1.3vw,25px);line-height:1.45;color:#eae4d6;border-bottom:1px dashed var(--line-s)}
.spc li::before{content:'';position:absolute;left:0;top:calc(1.2vh + .55em);width:10px;height:10px;border:1.5px solid var(--g);transform:rotate(45deg)}
.sl.on .spc li{animation:left .85s var(--e) both}
.sl.on .spc li:nth-child(1){animation-delay:.5s}.sl.on .spc li:nth-child(2){animation-delay:.65s}.sl.on .spc li:nth-child(3){animation-delay:.8s}.sl.on .spc li:nth-child(4){animation-delay:.95s}.sl.on .spc li:nth-child(5){animation-delay:1.1s}
.bar{margin-bottom:2.4vh}.bar .l{display:flex;justify-content:space-between;font-size:clamp(14px,1.15vw,22px);color:#cfc7b6;margin-bottom:.9vh;gap:2vw}.bar .l b{color:var(--gp);font-family:var(--disp);font-size:1.25em;font-weight:600;text-align:right}
.bar .tr{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}.bar .fl{height:100%;width:0;background:linear-gradient(90deg,var(--gd),var(--gh));box-shadow:0 0 12px rgba(227,178,94,.55);transition:width 1.6s var(--e)}
.sl.on .bar .fl{width:var(--w)}
.sl.on .bar{animation:upS .8s var(--e) both}.sl.on .bar:nth-child(2){animation-delay:.5s}.sl.on .bar:nth-child(3){animation-delay:.65s}.sl.on .bar:nth-child(4){animation-delay:.8s}.sl.on .bar:nth-child(5){animation-delay:.95s}
.dims{display:flex;gap:1.6vw;margin-top:3vh;flex-wrap:wrap}
.dim{border:1px solid var(--line);border-radius:1.2rem;padding:2vh 2vw;background:linear-gradient(170deg,rgba(22,41,74,.7),rgba(11,21,38,.85));min-width:12vw}
.dim b{display:block;font-family:var(--disp);font-size:clamp(34px,3.2vw,60px);color:var(--gp);line-height:1;font-weight:700}.dim small{font-size:clamp(11px,.85vw,15px);letter-spacing:.22em;text-transform:uppercase;color:var(--g)}
/* timeline */
.tl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 6vw 6vh}
.tl h2{font-family:var(--disp);font-size:clamp(32px,3.7vw,62px);color:var(--gp);margin-bottom:5vh}
.tl .row{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1.6vw;padding-top:3vh}
.tl .row::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:var(--line-s)}
.tl .prog{position:absolute;left:0;top:0;height:1px;width:0;background:linear-gradient(90deg,var(--gd),var(--gh));box-shadow:0 0 12px rgba(227,178,94,.6);transition:width 3s linear}
.sl.on .tl .prog{width:100%}
.tl .it{position:relative}
.tl .it::before{content:'';position:absolute;left:0;top:calc(-3vh - 6px);width:12px;height:12px;border-radius:50%;background:var(--n9);border:1.5px solid var(--g)}
.tl .it.hl::before{background:var(--gh);box-shadow:0 0 0 6px rgba(216,178,108,.2)}
.tl .it b{display:block;font-family:var(--disp);font-size:clamp(20px,1.9vw,36px);color:var(--gp);margin-bottom:1.2vh;font-weight:700}
.tl .it.hl b{color:#fff}
.tl .it p{font-size:clamp(13px,1.05vw,20px);line-height:1.5;color:#cfc7b6}
.sl.on .tl h2{animation:up 1s var(--e) .15s both}
.sl.on .tl .it{animation:upS .8s var(--e) both}
.sl.on .tl .it:nth-child(2){animation-delay:.45s}.sl.on .tl .it:nth-child(3){animation-delay:.65s}.sl.on .tl .it:nth-child(4){animation-delay:.85s}.sl.on .tl .it:nth-child(5){animation-delay:1.05s}.sl.on .tl .it:nth-child(6){animation-delay:1.25s}.sl.on .tl .it:nth-child(7){animation-delay:1.45s}.sl.on .tl .it:nth-child(8){animation-delay:1.65s}
/* nav */
#nav{position:absolute;inset:0;pointer-events:none;z-index:20}
.arr{position:absolute;bottom:3.4vh;width:clamp(44px,3.4vw,60px);height:clamp(44px,3.4vw,60px);border-radius:50%;border:1.5px solid var(--line);background:rgba(9,17,29,.55);color:var(--gp);pointer-events:auto;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.arr svg{width:40%;height:40%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arr:hover{border-color:var(--g)}#prev{left:2.4vw}#next{right:2.4vw}
#dots{position:absolute;left:0;right:0;bottom:8.6vh;display:flex;gap:8px;justify-content:center;pointer-events:auto}
#dots i{width:8px;height:8px;border-radius:50%;background:rgba(245,238,223,.26);cursor:pointer;transition:all .4s var(--e)}#dots i.on{background:var(--gh);transform:scale(1.6)}
#cnt{position:absolute;left:2.4vw;bottom:9.4vh;font-family:var(--disp);font-size:clamp(14px,1.15vw,21px);letter-spacing:.2em;color:var(--gp);opacity:.85}
#home{position:absolute;left:50%;bottom:2.6vh;transform:translateX(-50%);pointer-events:auto;display:flex;align-items:center;gap:1rem;padding:1rem 2.4rem;border:1px solid var(--line);border-radius:999px;background:rgba(9,17,29,.62);font-size:clamp(13px,1.05vw,19px);letter-spacing:.24em;text-transform:uppercase;color:var(--gp);backdrop-filter:blur(6px)}
#home svg{width:1.6em;height:1.6em;fill:none;stroke:var(--g);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}#home:hover{border-color:var(--g)}
@media (max-aspect-ratio:1/1){
